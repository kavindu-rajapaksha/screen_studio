<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Recording Area</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            cursor: crosshair;
            background: rgba(0, 0, 0, 0.25);
            font-family: Arial, sans-serif;
        }

        #instructions {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            padding: 14px 22px;
            color: white;
            background: #111827;
            border-radius: 10px;
            font-size: 15px;
            z-index: 10;
            white-space: nowrap;
        }

        #selection {
            position: absolute;
            display: none;
            border: 2px solid #6366f1;
            background: rgba(99, 102, 241, 0.15);
            pointer-events: none;
        }

        #actions {
            position: fixed;
            display: none;
            gap: 10px;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            z-index: 10;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        #confirm {
            background: #6366f1;
            color: white;
        }

        #cancel {
            background: #ffffff;
            color: #111827;
        }
    </style>
</head>

<body>
    <div id="instructions">
        Drag to select the recording area
    </div>

    <div id="selection"></div>

    <div id="actions">
        <button id="confirm">Use This Area</button>
        <button id="cancel">Cancel</button>
    </div>

    <script src="area-selection.js"></script>
</body>
</html>
